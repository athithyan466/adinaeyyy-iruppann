<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adineyy iruppen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section id="home" class="screen home-screen active">
    <div class="hero"></div>
    <div class="shade"></div>
    <div class="home-content">
      <h1>Adineyy iruppen</h1>
      <div class="home-buttons">
        <button id="addBtn" class="main-btn">ADD A SONG <span>＋</span></button>
        <button id="playBtn" class="main-btn">PLAY SONGS <span>▶</span></button>
      </div>
      <div id="countHome" class="count">0 / 60</div>
    </div>
  </section>

  <section id="add" class="screen inner-screen">
    <div class="background"></div>
    <div class="panel">
      <button class="back" data-back>← Back</button>
      <h2>Add a Song</h2>
      <label>Your Name</label>
      <input id="nameInput" type="text" maxlength="60" placeholder="Enter name">
      <label>Favorite Song</label>
      <input id="songInput" type="text" maxlength="120" placeholder="Enter song name">
      <label>Song File</label>
      <input id="fileInput" type="file" accept="audio/*">
      <button id="saveBtn" class="save-btn">ADD SONG</button>
      <div id="countAdd" class="count">0 / 60</div>
      <div id="savedList" class="saved-list"></div>
    </div>
  </section>

  <section id="play" class="screen inner-screen play-screen">
    <div class="play-bg"></div>
    <div class="play-shade"></div>
    <button class="back play-back" data-back>← Back</button>
    <div class="play-content">
      <h2>Adineyy iruppen</h2>
      <div class="person-image"></div>
      <div class="announcement" id="announcement">HERE COMES ATHI</div>
      <div class="track-name" id="trackName">No songs yet</div>
      <div class="wave" id="wave"></div>
      <div class="progress-wrap">
        <input id="progress" type="range" min="0" max="100" value="0">
        <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
      </div>
      <div class="controls">
        <button id="shuffleBtn" class="control">⤨</button>
        <button id="prevBtn" class="control">◀</button>
        <button id="playPauseBtn" class="play-control">▶</button>
        <button id="nextBtn" class="control">▶</button>
        <button id="repeatBtn" class="control">↻</button>
      </div>
      <div id="playCount" class="count">0 / 60</div>
    </div>
  </section>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
